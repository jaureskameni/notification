---
openapi: "3.0.3"
info:
  title: "UAM-EVENT"
  description: "UAM event"
  version: "2026-W17"
servers:
- url: "https"
- url: "http"
paths: {}
components:
  schemas:
    DomainEventType:
      type: "string"
      enum:
      - "USER_CREATED"
    UserCreatedEventDTO:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        identityId:
          type: "string"
          format: "uuid"
        lastname:
          type: "string"
        firstname:
          type: "string"
        email:
          type: "string"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumberDTO"
        createdAt:
          type: "string"
          format: "date-time"
          description: "specify the user's creation date"
    PhoneNumberDTO:
      type: "object"
      properties:
        countryCode:
          type: "string"
          description: "the international code for the country"
          example: "237 for Cameroon"
        number:
          type: "string"
          description: "the phone number"
          example: "653492410"
