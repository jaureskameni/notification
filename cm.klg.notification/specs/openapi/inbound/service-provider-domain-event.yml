---
openapi: "3.0.3"
info:
  title: "SERVICE-PROVIDER-EVENT"
  description: "Service provider domain event"
  version: "2026-W17"
servers:
- url: "https"
- url: "http"
paths: {}
components:
  schemas:
    DomainEventType:
      type: "string"
      enum:
      - "SERVICE_PROVIDER_APPROVED"
      - "SERVICE_PROVIDER_REJECTED"
      - "SERVICE_PROVIDER_PROFILE_IMAGE_APPROVED"
      - "SERVICE_PROVIDER_PROFILE_IMAGE_REJECTED"
    RejectionReason:
      type: "string"
      enum:
      - "NAME_MISMATCH"
      - "CNI_EXPIRED"
      - "CNI_UNREADABLE"
      - "CNI_INVALID"
      - "FACE_MISMATCH"
      - "FACE_UNCLEAR"
      - "PHOTO_UNCLEAR"
      - "DOCUMENT_TAMPERED"
      - "PROFILE_IMAGE_UNCLEAR"
    ServiceProviderApprovedEventDTO:
      type: "object"
      properties:
        serviceProviderId:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        approvedBy:
          type: "string"
          format: "uuid"
        approvedAt:
          type: "string"
          format: "date-time"
    ServiceProviderRejectedEventDTO:
      type: "object"
      properties:
        serviceProviderId:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        rejectedBy:
          type: "string"
          format: "uuid"
        reason:
          $ref: "#/components/schemas/RejectionReason"
        rejectedAt:
          type: "string"
          format: "date-time"
    ServiceProviderProfileImageApprovedEventDTO:
      type: "object"
      properties:
        serviceProviderId:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        approvedBy:
          type: "string"
          format: "uuid"
        profileImageMediaId:
          type: "string"
          format: "uuid"
        approvedAt:
          type: "string"
          format: "date-time"
    ServiceProviderProfileImageRejectedEventDTO:
      type: "object"
      properties:
        serviceProviderId:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        rejectedBy:
          type: "string"
          format: "uuid"
        reason:
          $ref: "#/components/schemas/RejectionReason"
        rejectedAt:
          type: "string"
          format: "date-time"
